# Relief Inventory — Docker Compose stack. This is the ONLY file you need to edit.
#
#   1. Set APP_URL in the "YOUR SETTINGS" block below.
#   2. docker compose up -d
#   3. Open that address in a browser: a setup wizard creates your administrator
#      account (and can load example data). That's it.
#
# Database passwords are generated randomly on first start and kept in the
# `secrets` volume — you never have to choose or see them. See README.md for
# HTTPS, backups and upgrades.
#
# Services (the same image runs init, web, queue, scheduler and reverb):
#   init       one-shot: creates the database passwords the first time
#   db         MariaDB (data in the `db-data` volume)
#   provisioner the only container that holds the database administrator password: makes each
#              warehouse's schema and database user (the others can't read it)
#   app        web server + first-run migrate/seed/admin bootstrap
#   queue      queue worker
#   scheduler  hourly volunteer-window sync + daily database dump to ./backups
#   reverb     optional realtime; enable with `--profile realtime`

name: reliefinventory

# ============================== YOUR SETTINGS ===============================
x-settings: &settings
  # The address people type into their browser — used for links in e-mails and
  # redirects. Include http:// or https:// (and the port if it isn't 80/443).
  # If you change the port, change the "8080:8080" mapping under `app` too.
  APP_URL: http://localhost:8080

  # --- Optional: uncomment and edit what you need ---------------------------

  # If this server is reachable from the internet before you've finished the
  # setup wizard, require a code to complete it (anyone who opens the page first
  # could otherwise become the administrator). Pick any string.
  # RI_SETUP_CODE: choose-a-code

  # Skip the wizard and create the administrator from the command line instead
  # (unattended installs). A random password is printed once in the app log
  # unless you set RI_ADMIN_PASSWORD.
  # RI_ADMIN_EMAIL: admin@example.com
  # APP_NAME: Relief Inventory
  # APP_TIMEZONE: America/New_York      # default UTC; any PHP timezone name
  # RI_ADMIN_PASSWORD: choose-one       # (with RI_ADMIN_EMAIL) instead of a generated one
  # RI_ADMIN_FIRST_NAME: Pat
  # RI_ADMIN_LAST_NAME: Smith

  # Behind an HTTPS reverse proxy: its address(es), comma separated, or * if
  # only the proxy can reach this container (see README.md).
  # TRUSTED_PROXIES: "*"

  # Outbound e-mail (feedback reports, account e-mails). `log` just writes
  # e-mails to the app log, which is fine for trying things out.
  MAIL_MAILER: log
  # MAIL_MAILER: smtp
  # MAIL_HOST: smtp.example.com
  # MAIL_PORT: 587
  # MAIL_USERNAME: me@example.com
  # MAIL_PASSWORD: secret
  # MAIL_ENCRYPTION: tls
  # MAIL_FROM_ADDRESS: relief-inventory@example.com
  # FEEDBACK_NOTIFY_EMAIL: developer@example.com

  # Cloudflare Turnstile (bot check on /register and password reset). The app
  # turns it on unless told otherwise, and an enabled Turnstile with no keys
  # makes those pages answer 500 — so it is off here until you have keys
  # (free at dash.cloudflare.com > Turnstile; needs Internet access).
  CLOUDFLARE_TURNSTILE_ENABLED: "false"
  # CLOUDFLARE_TURNSTILE_ENABLED: "true"
  # CLOUDFLARE_TURNSTILE_SITE_KEY: your-site-key
  # CLOUDFLARE_TURNSTILE_SECRET_KEY: your-secret-key

  # Slow-query log: the app records every database query slower than this many
  # milliseconds (with the page that ran it) and MariaDB keeps its own slow log
  # (see the `db` service). View both at Setup > Testing Tools, or:
  #   docker compose exec app php artisan slowlog:show
  # Set to 0 to turn the app-side recording off.
  RI_SLOW_QUERY_MS: 250

  # Credit line on the welcome page.
  # HOSTED_BY: Example Relief Org
  # HOSTED_LINK: https://example.org

  # Daily backup zip (written to ./backups next to this file).
  # RI_BACKUP_ENABLED: "true"
  # RI_BACKUP_HOUR: 2                   # local hour (follows APP_TIMEZONE)
  # RI_BACKUP_KEEP_DAYS: 14             # flat retention: no daily/monthly/yearly tiers here
  # RI_BACKUP_SCOPE: database           # or "full" to include the uploaded files
  # An upgrade that has pending migrations dumps the database first (into the same
  # ./backups) and won't migrate if the dump fails. Set to "false" to opt out.
  # RI_PREMIGRATE_BACKUP: "true"

  # Federation (Setup > Trust Console). Only for unusual setups:
  # RI_FEDERATION_ALLOW_HTTP: "true"        # let this site reach another over plain http:// (a private network)
  # RI_FEDERATION_ALLOW_PRIVATE: "true"     # ...and at private/loopback addresses (LAN-only sites, local testing)

  # Updates from the web page (Updates & Backups, instance administrators only): the app only *asks*; a small
  # service on this machine (docker/updater/, see README.md "Automatic updates") does the pull and restart.
  # Any long random string; the updater reads the same value from this file. Leave it unset to keep updating by hand.
  # RI_UPDATE_SECRET: choose-a-long-random-string

  # Passwords are generated for you. Only set these to pick your own, and only
  # BEFORE the first `docker compose up` (afterwards they're already in the
  # database and changing them here would lock the app out).
  # DB_PASSWORD: choose-one
  # DB_ROOT_PASSWORD: choose-one

  # Keep the application key stable if you manage secrets yourself; by default
  # one is generated and stored in the `storage` volume.
  # APP_KEY: base64:...
# ============================================================================

x-app: &app
  # Which version you run. `latest` is the newest published release (GitHub Releases), so
  # `docker compose pull && docker compose up -d` upgrades you to it. Leave it on `latest`: the
  # software is changing quickly and only the current release is supported.
  #   :latest   the newest release (recommended)
  #   :1.4.0    pin one release (e.g. to hold off an upgrade for a few days). Only the newest
  #             release gets fixes, and you can't go back to an older one once a newer one
  #             has migrated the database (see README.md > Upgrading).
  #   :edge     unreleased development builds, for testing only. Never use it with real data.
  image: ghcr.io/fiforms/reliefinventory:latest
  # (only used by `docker compose build`, i.e. when working from a git checkout)
  build:
    context: ..
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &app-env
    <<: *settings
    TZ: UTC
    DB_CONNECTION: mariadb
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: reliefinventory
    DB_USERNAME: reliefinventory
    DB_PASSWORD_FILE: /secrets/db_password
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    # Daily backups, pre-migration backups and the zips made from Updates & Backups in the app all live here.
    RI_BACKUP_DIR: /backups
    # Each warehouse's key file (MULTI_WAREHOUSE.md §2): outside `storage`, so never in a backup.
    RI_WAREHOUSE_SECRETS_DIR: /warehouse-secrets
  volumes:
    # private uploads, logs, caches, print-queue PDFs and the generated APP_KEY
    - storage:/var/www/html/storage
    - secrets:/secrets:ro
    # Deliberately a host directory outside `storage`, so a backup never contains earlier backups.
    - ./backups:/backups
    - warehouse-secrets:/warehouse-secrets:ro

services:
  init:
    <<: *app
    command: ["init-secrets"]
    restart: "no"
    healthcheck:
      disable: true
    volumes:
      - secrets:/secrets
      - admin-secrets:/admin-secrets

  db:
    image: mariadb:11
    restart: unless-stopped
    # MariaDB's own slow-query log, written to the mysql.slow_log table (the app reads it for
    # Setup > Testing Tools; the scheduler empties it when it gets big). 0.25 s matches RI_SLOW_QUERY_MS above.
    command: ["--slow-query-log=1", "--long-query-time=0.25", "--log-output=TABLE"]
    environment:
      MARIADB_DATABASE: reliefinventory
      MARIADB_USER: reliefinventory
      MARIADB_PASSWORD_FILE: /secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /admin-secrets/db_root_password
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - db-data:/var/lib/mysql
      - secrets:/secrets:ro
      - admin-secrets:/admin-secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Holds the database administrator password (MULTI_WAREHOUSE.md §7), which no other container mounts. Reads plain
  # commands from the control schema ("make warehouse X's schema and user") and re-checks each against the
  # warehouse's own record. Also makes the instance's own schemas at start-up, which `app` waits for.
  provisioner:
    <<: *app
    command: ["provisioner"]
    healthcheck:
      disable: true
    environment:
      <<: *app-env
      RI_DB_ROOT_PASSWORD_FILE: /admin-secrets/db_root_password
    # Also the storage volume and ./backups: the whole-instance backup and restore (`php artisan instance:backup` /
    # `restore:instance`, run in this container) read and write every warehouse's files and the zips.
    volumes:
      - secrets:/secrets:ro
      - admin-secrets:/admin-secrets:ro
      - warehouse-secrets:/warehouse-secrets
      - storage:/var/www/html/storage
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    command: ["web"]
    ports:
      - "8080:8080"
    # The same as above, except that only this container may write the warehouse key files.
    volumes:
      - storage:/var/www/html/storage
      - secrets:/secrets:ro
      - ./backups:/backups
      - warehouse-secrets:/warehouse-secrets
    depends_on:
      db:
        condition: service_healthy
      provisioner:
        condition: service_started

  queue:
    <<: *app
    command: ["queue"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["scheduler"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  reverb:
    <<: *app
    profiles: ["realtime"]
    command: ["reverb"]
    healthcheck:
      disable: true
    ports:
      - "8081:8080"
    environment:
      <<: *app-env
      BROADCAST_CONNECTION: reverb
      # REVERB_APP_ID / REVERB_APP_KEY / REVERB_APP_SECRET: see ../scripts/REVERB.md
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      app:
        condition: service_healthy

volumes:
  db-data:
  storage:
  # Generated database passwords. Keep this volume together with db-data: the
  # database was initialised with these values.
  secrets:
  # The database administrator password, in a volume of its own that only `init`, `db` and `provisioner` mount.
  # Keep it together with db-data too.
  admin-secrets:
  # Each warehouse's encryption key. Keep it together with db-data and storage:
  # without its key a warehouse's encrypted settings can't be read.
  warehouse-secrets:
