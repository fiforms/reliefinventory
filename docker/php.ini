; Overrides on top of php.ini-production (see Dockerfile).
memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 40M
max_execution_time = 120
expose_php = Off
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Reports render PDFs; set a sane default so date() output is not "UTC by accident".
; The app itself sets its own timezone from APP_TIMEZONE / config/app.php.
