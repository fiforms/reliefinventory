name: Print client (Windows)

# Manual only — run from the Actions tab. Tests the core, fetches SumatraPDF (the bundled PDF
# printer; GPLv3), then builds an UNSIGNED installer (SmartScreen will warn until we have a
# code-signing certificate).
on:
  workflow_dispatch:
    inputs:
      sumatra_version:
        description: "SumatraPDF release to bundle (the 64-bit portable zip from sumatrapdfreader.org/dl/rel/<version>/)"
        default: "3.5.2"
        required: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: print-client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            print-client
            print-client/src-tauri
      - name: Test core
        run: cargo test -p ri-print-core
      - name: Fetch SumatraPDF
        shell: pwsh
        env:
          VERSION: ${{ inputs.sumatra_version }}
        run: |
          $url = "https://www.sumatrapdfreader.org/dl/rel/$env:VERSION/SumatraPDF-$env:VERSION-64.zip"
          Invoke-WebRequest $url -OutFile sumatra.zip
          Expand-Archive sumatra.zip -DestinationPath sumatra-extract
          $exe = Get-ChildItem sumatra-extract -Filter *.exe | Select-Object -First 1
          Copy-Item $exe.FullName src-tauri/resources/SumatraPDF.exe
          @"
          SumatraPDF $env:VERSION is licensed under the GNU GPL v3.
          Source code: https://github.com/sumatrapdfreader/sumatrapdf
          License text: https://www.gnu.org/licenses/gpl-3.0.txt
          "@ | Set-Content src-tauri/resources/SumatraPDF-LICENSE.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: print-client/package-lock.json
      - run: npm ci
      - name: Build installers
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ri-print-windows
          path: |
            print-client/src-tauri/target/release/bundle/nsis/*.exe
            print-client/src-tauri/target/release/bundle/msi/*.msi
