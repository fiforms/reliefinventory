name: Print client (Linux)

# Manual only — run from the Actions tab. Tests the core, then builds the .deb and AppImage.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: print-client
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev cups-client
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            print-client
            print-client/src-tauri
      - name: Test core
        run: cargo test -p ri-print-core
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: print-client/package-lock.json
      - run: npm ci
      - name: Build installers
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: ri-print-linux
          path: |
            print-client/src-tauri/target/release/bundle/deb/*.deb
            print-client/src-tauri/target/release/bundle/appimage/*.AppImage
