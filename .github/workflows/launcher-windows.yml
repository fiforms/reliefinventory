name: RI Launcher (Windows)

# Manual only — run from the Actions tab. Tests the core (on Windows, where the WSL backend's real code
# paths compile), then builds an UNSIGNED installer (SmartScreen will warn until we have a code-signing
# certificate: "More info" > "Run anyway").
on:
  workflow_dispatch:

# The version shown in the window: the release tag when run from a tag, otherwise the commit hash (launcher/src-tauri/build.rs).
env:
  RI_BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            launcher
            launcher/src-tauri
      - name: Test core
        run: cargo test -p ri-launcher-core
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - name: Build installers
        run: npm run build:app
      - uses: actions/upload-artifact@v4
        with:
          name: ri-launcher-windows
          path: |
            launcher/src-tauri/target/release/bundle/nsis/*.exe
            launcher/src-tauri/target/release/bundle/msi/*.msi
