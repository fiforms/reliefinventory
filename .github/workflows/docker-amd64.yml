name: Docker image (x64)

# Manual only: Actions tab > "Docker image (x64)" > Run workflow.
# Builds the linux/amd64 image on a native runner (no emulation). With "push"
# ticked it publishes ghcr.io/<repo>:<tag>-amd64; otherwise it is just a build check.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag prefix (published as <tag>-amd64)'
        required: true
        default: latest
      push:
        description: 'Push to GitHub Container Registry'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}-amd64
          build-args: |
            RI_GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
