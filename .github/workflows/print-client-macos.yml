name: Print client (macOS)

# Manual only — run from the Actions tab. Tests the core, then builds an AD-HOC signed .dmg
# (signing identity "-": no Apple account needed). Without any signature, Apple Silicon Macs call a
# downloaded app "damaged and can't be opened"; ad-hoc signing makes that the ordinary "Apple could not
# verify…" prompt, which can be allowed in System Settings > Privacy & Security > Open Anyway.
# Gatekeeper still warns until we have an Apple Developer ID + notarization.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: print-client
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            print-client
            print-client/src-tauri
      - name: Test core
        run: cargo test -p ri-print-core
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: print-client/package-lock.json
      - run: npm ci
      - name: Build installer
        run: npm run tauri build
        env:
          APPLE_SIGNING_IDENTITY: "-"
      - name: Verify signature
        run: |
          app=$(ls -d src-tauri/target/release/bundle/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -i signature
      - uses: actions/upload-artifact@v4
        with:
          name: ri-print-macos
          path: print-client/src-tauri/target/release/bundle/dmg/*.dmg
